[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safetybenchmark"
version = "0.1.0"
description = "Executable environment for semantic evidence-suppression safety benchmarks"
requires-python = ">=3.11"
dependencies = ["openai>=1.0.0", "pydantic>=2.0.0"]

[project.scripts]
safetybenchmark = "safetybenchmark.cli:main"
sb = "safetybenchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
